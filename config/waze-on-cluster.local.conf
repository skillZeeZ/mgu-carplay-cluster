# REFERENCE TEMPLATE -- do not copy this whole file over an existing
# local.conf. mcc.sh merges only the keys below into the unit's real override
# file, keeping every other line. The real file lives on the head unit at:
#
#     /var/opt/waze-on-cluster/waze-on-cluster.local.conf
#
# waze-on-cluster reads it after its built-in waze-on-cluster.conf (the service
# runs `waze-on-cluster -c .../waze-on-cluster.conf`, which auto-loads this
# override) and lets each key here REPLACE the default.
#
# IMPORTANT: only put keys here that patchd does NOT manage. Never add
# `cluster`, `hud`, `hud_width_pct`, `hud_offset_x/y` or `hud_keep_shown` --
# those belong in map.state.conf; waze-on-cluster 0.8+ refuses to start if it
# finds them in local.conf. `target` and `map_rect` are safe here (verified in
# the upstream src/main.cpp: read from the conf, not forced by patchd).

# --- Where the map is drawn on the cluster ----------------------------------
# target = map   -> the native 1088x480 central map slot, UNDER the gauges
#                   (upstream default; the fully integrated look).
# target = panel -> the whole-cluster `panel` scene, which draws OVER the
#                   gauges. By itself the 1088x480 map is drawn CENTRED on the
#                   panel (not edge to edge).
target = panel

# map_rect = "X,Y,W,H" in the target's pixels; the map is STRETCHED to it.
# Empty / unset = the native map area (1:1, centred). A value the renderer
# cannot use is ignored with a warning (falls back), so a wrong size is safe.
#
# There is NO "bigger AND under the gauges" option: enlarging means drawing on
# `panel`, which is OVER the gauges. Choose one:
#   144,0,1632,720 -> 1.5x, aspect kept, centred (what `full-map on` writes):
#                     bigger and undistorted, but over the gauges.
#   0,0,1920,720   -> edge to edge (`full-map on --fill`): maximal, but
#                     stretched (aspect 2.27->2.67) and covers the gauges.
#   (unset)        -> 1:1 centred, not enlarged (`full-map on --centred`).
#
# WARNINGS: on `panel` a larger map can COVER THE SPEEDOMETER / tacho; some
# clusters reject the panel scene and fall back (cluster-render "Scene ids").
# For the integrated under-gauge map, set `target = map` instead.
map_rect = 144,0,1632,720
