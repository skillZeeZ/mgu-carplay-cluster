name: shellcheck
on:
  push:
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts (POSIX sh)
        # -x follows the sourced mcc-lib.sh, so its helpers are not flagged unused.
        run: shellcheck -x --shell=sh bin/mcc.sh
